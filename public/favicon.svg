<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf3d8"/>
      <stop offset="0.5" stop-color="#e6edf5"/>
      <stop offset="1" stop-color="#cfdef0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
  <!-- sunny sky background -->
  <rect width="64" height="64" rx="14" fill="url(#sky)"/>
  <!-- frosted glass card -->
  <rect x="7" y="7" width="50" height="50" rx="11" fill="url(#sheen)" stroke="#ffffff" stroke-opacity="0.95" stroke-width="1.5"/>
  <!-- EQ monogram -->
  <text x="32" y="42.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="25" letter-spacing="-1.5" fill="#1d4f9e">EQ</text>
</svg>
